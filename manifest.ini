name = "SmartHomeControl"
summary = "Smart Home Control"
description = """Control smart home devices (Meross, Netatmo, VeSync, Cozytouch/Atlantic - Cozytouch experimental) directly from NVDA"""
author = "Philipp Hasel <blindbyte06@gmail.com>"
url = "https://github.com/BlindByte06/SmartHomeControl"
version = "26.10.1"
changelog = """- New: platform status (Ctrl+P in the device menu) - which platforms had a fault, when they came back, and which devices did not answer. Which of these faults are announced can be set in the notifications tab.
- An unreachable platform is shown at the platform in the device tree, in the status line and in the connection diagnostics; a platform that answers only in part counts as a fault too.
- Sensors of a Meross hub no longer disappear when the hub does not answer, and they come back without an NVDA restart. Their favourites keep working.
- The heating times of the hot water heat pump can be changed from the device entry, for several weekdays at once; the program is read back from the appliance.
- Changes made outside the add-on reach the history for Netatmo, VeSync and Cozytouch too.
- The boost duration and a changed time program are readable in the history instead of showing their internal values.
- The view selector of the history keeps the focus while a view is chosen."""
minimumNVDAVersion = "2025.1.0"
lastTestedNVDAVersion = "2026.2"
docFileName = "readme.html"
