name = "SmartHomeControl"
summary = "Smart Home Control"
description = """Control smart home devices (Meross, Netatmo, VeSync, Cozytouch/Atlantic - Cozytouch experimental) directly from NVDA"""
author = "Philipp Hasel <blindbyte06@gmail.com>"
url = "https://github.com/BlindByte06/SmartHomeControl"
version = "26.9.1"
changelog = """- Credentials no longer live in NVDA's configuration but in a file of their own. NVDA writes the complete configuration into the log when it starts, so the email address used to travel with every log that was sent in. Existing credentials move by themselves on the first start, and nothing has to be entered again.
- The device menu no longer opens a second time on top of the first. The shortcut brings the menu that is already open to the front instead; the one left standing used to stop being updated without saying so."""
minimumNVDAVersion = "2025.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
