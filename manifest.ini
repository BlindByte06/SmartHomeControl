name = "SmartHomeControl"
summary = "Smart Home Control"
description = """Control smart home devices (Meross, Netatmo, VeSync, Cozytouch/Atlantic, Petlibro - Cozytouch and Petlibro experimental) directly from NVDA"""
author = "Philipp Hasel <blindbyte06@gmail.com>"
url = "https://github.com/BlindByte06/SmartHomeControl"
version = "26.10.2"
changelog = """- NVDA no longer crashes when the device menu is closed after a device was switched from the favourites tab.
- Enter or Space on a VeSync or Cozytouch device no longer freezes NVDA.
- A leak sensor that already detects water when NVDA starts is now announced.
- The Netatmo device menu offers "Add to favorites" again.
- The Netatmo relay shows its heating state, Wi-Fi and radio signal instead of the thermostat's target temperature.
- A setting changed in the VeSync or Cozytouch device menu is no longer also recorded as changed elsewhere.
- A Meross device switched here is no longer taken for one switched elsewhere.
- A Cozytouch command the appliance takes over late is announced as sent and confirmed once it arrives, instead of being reported as failed.
- A Cozytouch boost that runs out after an NVDA restart is recorded as ended.
- The Cozytouch away period is shown in the date format of the region.
- A Meross account with two-factor authentication is named as the reason the sign-in fails, and such a sign-in is no longer retried for good.
- Testing the Netatmo connection no longer invalidates the running sign-in.
- A foreign call of the Netatmo callback address no longer ends the sign-in.
- A Cozytouch server fault at sign-in is retried.
- Saving the settings in the device menu signs in as at NVDA start, including the new attempt after a network error.
- Renewed tokens no longer write NVDA's whole configuration to disk.
- NVDA exits faster on a slow network.
- Meross garage door openers and roller shutters are shown but not switched."""
minimumNVDAVersion = "2025.1.0"
lastTestedNVDAVersion = "2026.2"
docFileName = "readme.html"
