name = "SmartHomeControl"
summary = "Smart Home Control"
description = """Control smart home devices (Meross, Netatmo, VeSync, Cozytouch/Atlantic, Petlibro - Cozytouch and Petlibro experimental) directly from NVDA"""
author = "Philipp Hasel <blindbyte06@gmail.com>"
url = "https://github.com/BlindByte06/SmartHomeControl"
version = "26.10.2"
changelog = """- Netatmo: "Add to favorites" is offered in the device menu again.
- VeSync and Cozytouch: a setting changed here is no longer also recorded as changed elsewhere.
- Cozytouch: a command the appliance takes over late is announced as sent and confirmed once it arrives, instead of being reported as failed.
- Cozytouch: a boost that runs out after an NVDA restart is recorded as ended, and history entries are kept when the menu is closed early.
- The Cozytouch away period is shown in the date format of the region.
- Meross: a device switched here is no longer taken for one switched elsewhere.
- Netatmo sign-in: a foreign call of the callback address no longer ends the sign-in."""
minimumNVDAVersion = "2025.1.0"
lastTestedNVDAVersion = "2026.2"
docFileName = "readme.html"
