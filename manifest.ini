name = "SmartHomeControl"
summary = "Smart Home Control"
description = "Control smart home devices (Meross, Netatmo, VeSync/Levoit, Cozytouch/Atlantic - Cozytouch experimental) directly from NVDA with an accessible menu"
author = "Philipp Hasel <blindbyte06@gmail.com>"
url = "https://github.com/BlindByte06/SmartHomeControl"
version = "26.8.1beta2"
changelog = "Beta. Changed credentials are now proven at the platform before they are saved, and they reach a session that is already running - a wrong password used to be accepted silently and only surfaced at the next NVDA start. A refused login offers to enter the credentials again right away, at the tab concerned. Two parallel logins of the same platform can no longer happen. Cosori air fryers of the CAF-P583S series report their programme, their remaining time and both temperatures, and a cooking programme can now be started and stopped after a prompt - the programme list is supplied by the appliance itself rather than written into the add-on. A Levoit purifier's sensor dropout is no longer announced as "-1" or recorded as a measurement. In the favorites layer the switching press now has to follow the announcement within a few seconds, adjustable in the settings - a digit pressed by accident much later announces the status again instead of switching. Ctrl+B in the favorites tab now removes the outlet it is standing on rather than the whole power strip."
minimumNVDAVersion = "2025.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
