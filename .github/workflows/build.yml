name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Creating a release (softprops/action-gh-release) needs write access to
# contents; depending on the repository setting the GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # build_addon.py needs polib for the translation check. Without polib the
    # script skips that check silently - a broken translation would then only
    # show up in the finished add-on. pyflakes checks the add-on code (see the
    # next step).
    - name: Install build dependencies
      run: python -m pip install --upgrade pip polib pyflakes

    # The pack step only copies files - a syntax error or a dead import would
    # otherwise surface at runtime, at the user. compileall compiles every
    # file, pyflakes finds unused and missing names. Only globalPlugins/:
    # lib/ is bundled third-party code.
    #
    # IMPORTANT: Python 3.11 above is not arbitrary but the version of the
    # oldest supported NVDA release (2025.1). That is exactly why this catches
    # what still passes on a development machine running 3.12 - an f-string
    # whose expression uses the same quotes as the f-string itself (PEP 701),
    # for instance. "build_addon.py py311" checks the same thing independently
    # of the version and runs as part of packing anyway.
    - name: Check add-on code
      run: |
        python -m compileall -q globalPlugins
        python -m pyflakes globalPlugins/SmartHomeControl
        python build_addon.py py311

    # The checks under tools/checks/ assert what has already broken in this
    # add-on once - a translation without context, a cached lamp mode, a
    # sensor dropout, a tree that loses its selection. They need neither NVDA
    # nor an account, so they run here. PYTHONIOENCODING because the runner's
    # console is not UTF-8 and one of them prints CO2 with a subscript.
    - name: Run the checks
      env:
        PYTHONIOENCODING: utf-8
      run: |
        Get-ChildItem tools/checks/*.py | ForEach-Object {
          Write-Host "--- $($_.Name)"
          python $_.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }

    # Builds from manifest.ini, globalPlugins/, lib/, doc/ and locale/ - NOT
    # from the whole repository. Checks translations and package integrity
    # along the way and fails on any problem.
    - name: Build addon
      run: python build_addon.py pack

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartHomeControl
        path: dist/*.nvda-addon
        if-no-files-found: error

    # The release notes are the changelog section of the tagged version from
    # CHANGELOG.md (English - release pages are read internationally). If the
    # section is missing the step fails: a release without a changelog would
    # otherwise only be noticed after publication. The tag must also match the
    # version in manifest.ini, or the release would carry a different name
    # than the package inside it.
    - name: Build release notes (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $manifest = python -c "import build_addon; print(build_addon.read_version())"
        if ($version -ne $manifest) {
          Write-Host "::error::Tag v$version does not match manifest.ini ($manifest)"
          exit 1
        }
        python build_addon.py relnotes --version $version --out release-notes.md
        Get-Content release-notes.md

    # prerelease: a tag carrying "beta", "alpha" or "rc" must NOT become the
    # release that GitHub offers as the current one - testers would otherwise
    # be handed a beta as if it were the finished version.
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.nvda-addon
        body_path: release-notes.md
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
