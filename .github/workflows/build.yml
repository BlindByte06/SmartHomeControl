name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Read-only for everything that builds and checks. Only the release job, which
# runs for a tag and installs nothing, gets write access (see there). It used
# to be write access for the whole workflow: every push ran PyPI packages and
# the check scripts with a token that could push to the repository.
permissions:
  contents: read

# The actions are pinned to the commit of the release named beside them - a
# tag like v4 can be moved to other code at any time, a commit cannot. To
# update one, take the commit of the new release tag and adjust the comment.
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # The token is not left in .git/config for the steps that follow.
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    # build_addon.py needs polib for the translation check. Without polib the
    # script skips that check silently - a broken translation would then only
    # show up in the finished add-on. pyflakes checks the add-on code (see the
    # next step). Both pinned with their hashes in .github/requirements-ci.txt.
    - name: Install build dependencies
      run: python -m pip install --require-hashes -r .github/requirements-ci.txt

    # The pack step only copies files - a syntax error or a dead import would
    # otherwise surface at runtime, at the user. compileall compiles every
    # file, pyflakes finds unused and missing names. Only globalPlugins/:
    # lib/ is bundled third-party code.
    #
    # IMPORTANT: Python 3.11 above is not arbitrary but the version of the
    # oldest supported NVDA release (2025.1). That is exactly why this catches
    # what still passes on a development machine running 3.12 - an f-string
    # whose expression uses the same quotes as the f-string itself (PEP 701),
    # for instance. "build_addon.py py311" checks the same thing independently
    # of the version and runs as part of packing anyway.
    - name: Check add-on code
      run: |
        python -m compileall -q globalPlugins installTasks.py
        python -m pyflakes globalPlugins/SmartHomeControl installTasks.py
        python build_addon.py py311

    # The checks under tools/checks/ assert what has already broken in this
    # add-on once - a translation without context, a cached lamp mode, a
    # sensor dropout, a tree that loses its selection. They need neither NVDA
    # nor an account, so they run here. PYTHONIOENCODING because the runner's
    # console is not UTF-8 and one of them prints CO2 with a subscript.
    - name: Run the checks
      env:
        PYTHONIOENCODING: utf-8
      run: |
        Get-ChildItem tools/checks/*.py | ForEach-Object {
          Write-Host "--- $($_.Name)"
          python $_.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }

    # Looks every library pinned in requirements-bundle.txt up in the OSV
    # vulnerability database - the one pip-audit reads - and fails on a
    # known vulnerability: raise the version there, then "lock", "libs" and
    # "pack". It asks OSV directly and installs nothing. There is no NVDA on
    # the runner, so NVDA's own copies of requests, urllib3 and certifi (the
    # ones that actually run) are only covered when this runs on a machine
    # with NVDA installed.
    - name: Audit the bundled libraries
      run: python build_addon.py audit

    # Builds from manifest.ini, globalPlugins/, lib/, doc/ and locale/ - NOT
    # from the whole repository. Checks translations, the hash lock of the
    # bundled libraries and package integrity along the way and fails on any
    # problem.
    - name: Build addon
      run: python build_addon.py pack

    # The SHA-256 of the package goes into the release beside it, so a
    # download can be checked against what this build produced.
    - name: Checksum of the package
      run: |
        Get-ChildItem dist/*.nvda-addon | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
        }

    # The release notes are the changelog section of the tagged version from
    # CHANGELOG.md (English - release pages are read internationally). If the
    # section is missing the step fails: a release without a changelog would
    # otherwise only be noticed after publication. The tag must also match the
    # version in manifest.ini, or the release would carry a different name
    # than the package inside it.
    - name: Build release notes (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $manifest = python -c "import build_addon; print(build_addon.read_version())"
        if ($version -ne $manifest) {
          Write-Host "::error::Tag v$version does not match manifest.ini ($manifest)"
          exit 1
        }
        python build_addon.py relnotes --version $version --out dist/release-notes.md
        Get-Content dist/release-notes.md

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: SmartHomeControl
        path: |
          dist/*.nvda-addon
          dist/*.sha256
          dist/release-notes.md
        if-no-files-found: error

  # Creating a release needs write access to the repository's contents. This
  # job gets it, and only for a tag: it checks nothing out and installs
  # nothing, it takes what the build job produced and publishes it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download the build
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: SmartHomeControl
        path: dist

    # prerelease: a tag carrying "beta", "alpha" or "rc" must NOT become the
    # release that GitHub offers as the current one - testers would otherwise
    # be handed a beta as if it were the finished version.
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: |
          dist/*.nvda-addon
          dist/*.sha256
        body_path: dist/release-notes.md
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
