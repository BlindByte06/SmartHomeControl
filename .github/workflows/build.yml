name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # polib wird von build_addon.py für die Übersetzungsprüfung gebraucht.
    # Ohne polib überspringt das Skript die Prüfung stillschweigend - dann
    # würde eine kaputte Übersetzung erst im fertigen Add-on auffallen.
    - name: Install build dependencies
      run: python -m pip install --upgrade pip polib

    # Baut aus manifest.ini, globalPlugins/, lib/, doc/ und locale/ -
    # NICHT aus dem gesamten Repo. Prüft nebenbei Übersetzungen und
    # Paketintegrität und schlägt bei Problemen fehl.
    - name: Build addon
      run: python build_addon.py pack

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartHomeControl
        path: dist/*.nvda-addon
        if-no-files-found: error

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.nvda-addon
        body: |
          ## Smart Home Control ${{ github.ref_name }}

          Download und Installation:
          1. Laden Sie die .nvda-addon Datei herunter
          2. Öffnen Sie die Datei mit NVDA
          3. Bestätigen Sie die Installation
          4. Starten Sie NVDA neu

          Weitere Informationen im [README](README.md) und [CHANGELOG](CHANGELOG.md).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
