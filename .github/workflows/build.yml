name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Release-Erstellung (softprops/action-gh-release) braucht Schreibrechte auf
# Contents; je nach Repo-Einstellung ist der GITHUB_TOKEN sonst nur lesend.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # polib wird von build_addon.py für die Übersetzungsprüfung gebraucht.
    # Ohne polib überspringt das Skript die Prüfung stillschweigend - dann
    # würde eine kaputte Übersetzung erst im fertigen Add-on auffallen.
    # pyflakes prüft den Add-on-Code (siehe naechster Schritt).
    - name: Install build dependencies
      run: python -m pip install --upgrade pip polib pyflakes

    # Der Packschritt kopiert nur Dateien - ein Syntaxfehler oder ein toter
    # Import fiele sonst erst zur Laufzeit auf, beim Nutzer. compileall
    # uebersetzt jede Datei, pyflakes findet unbenutzte/fehlende Namen.
    # Nur globalPlugins/: lib/ ist gebuendelter Fremdcode.
    #
    # WICHTIG: Python 3.11 oben ist kein Zufall, sondern die Version der
    # aeltesten unterstuetzten NVDA-Fassung (2025.1). Genau deshalb faellt
    # hier auf, was auf einem Entwicklungsrechner mit 3.12 noch durchgeht -
    # etwa ein f-String, dessen Ausdruck dieselben Anfuehrungszeichen nutzt
    # wie der f-String selbst (PEP 701). "build_addon.py py311" prueft
    # dasselbe versionsunabhaengig und laeuft beim Packen ohnehin mit.
    - name: Check add-on code
      run: |
        python -m compileall -q globalPlugins
        python -m pyflakes globalPlugins/SmartHomeControl
        python build_addon.py py311

    # Baut aus manifest.ini, globalPlugins/, lib/, doc/ und locale/ -
    # NICHT aus dem gesamten Repo. Prüft nebenbei Übersetzungen und
    # Paketintegrität und schlägt bei Problemen fehl.
    - name: Build addon
      run: python build_addon.py pack

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartHomeControl
        path: dist/*.nvda-addon
        if-no-files-found: error

    # Die Release-Notes sind der Changelog-Abschnitt der getaggten Version
    # aus CHANGELOG.md (englisch - Release-Seiten werden international
    # gelesen). Fehlt der Abschnitt, bricht der Schritt ab: ein Release ohne
    # Changelog fiele sonst erst nach der Veröffentlichung auf.
    # Zusätzlich muss der Tag zur Version in manifest.ini passen, sonst trüge
    # das Release einen anderen Namen als das Paket darin.
    - name: Build release notes (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $manifest = python -c "import build_addon; print(build_addon.read_version())"
        if ($version -ne $manifest) {
          Write-Host "::error::Tag v$version passt nicht zu manifest.ini ($manifest)"
          exit 1
        }
        python build_addon.py relnotes --version $version --out release-notes.md
        Get-Content release-notes.md

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.nvda-addon
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
