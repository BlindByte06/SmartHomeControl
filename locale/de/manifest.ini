summary = "Smart Home Control"
description = """Smart-Home-Geräte (Meross, Netatmo, VeSync, Cozytouch/Atlantic - Cozytouch experimentell) direkt aus NVDA steuern"""
changelog = """- Neu: Plattform-Status (Strg+P im Geräte-Menü) – welche Plattformen gestört waren, wann sie zurückkamen, und welche Geräte nicht geantwortet haben. Welche dieser Störungen angesagt werden, lässt sich im Reiter „Benachrichtigungen" einstellen.
- Eine nicht erreichbare Plattform steht im Gerätebaum an der Plattform, in der Statuszeile und in der Verbindungsdiagnose; auch eine Plattform, die nur teilweise antwortet, gilt als Störung.
- Sensoren an einem Meross-Hub verschwinden nicht mehr, wenn der Hub nicht antwortet, und kommen ohne NVDA-Neustart zurück. Ihre Favoriten bleiben benutzbar.
- Die Heizzeiten der Warmwasser-Wärmepumpe lassen sich aus dem Geräteeintrag ändern, auch für mehrere Wochentage auf einmal; das Programm wird anschließend vom Gerät zurückgelesen.
- Änderungen von außerhalb der Erweiterung landen auch bei Netatmo, VeSync und Cozytouch in der Chronik.
- Die Boost-Dauer und ein geändertes Zeitprogramm stehen lesbar in der Chronik statt mit ihren internen Werten.
- Das Auswahlfeld für die Ansicht im Verlauf behält den Fokus, während eine Ansicht gewählt wird."""
