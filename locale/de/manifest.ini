summary = "Smart Home Control"
description = "Smart-Home-Geräte (Meross, Netatmo, VeSync/Levoit, Cozytouch/Atlantic - Cozytouch experimentell) direkt aus NVDA über ein barrierefreies Menü steuern"
changelog = "Die 18 Favoriten-Befehle sind durch eine Favoriten-Ebene mit einem einzigen frei belegbaren Kürzel ersetzt. Das Geräte-Menü öffnet schneller und geht sparsamer mit dem Cloud-Budget um, der Energieverbrauch wird zuverlässiger abgerufen, und erneuerte Netatmo-Zugänge werden gespeichert, sodass keine wiederholte Autorisierung nötig ist."
