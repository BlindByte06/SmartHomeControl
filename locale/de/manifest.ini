summary = "Smart Home Control"
description = """Smart-Home-Geräte (Meross, Netatmo, VeSync, Cozytouch/Atlantic - Cozytouch experimentell) direkt aus NVDA steuern"""
changelog = """- Die Zugangsdaten liegen nicht mehr in NVDAs Konfiguration, sondern in einer eigenen Datei. NVDA schreibt die vollständige Konfiguration beim Start ins Protokoll, die E-Mail-Adresse reiste also in jedem eingeschickten Log mit. Vorhandene Zugangsdaten ziehen beim ersten Start von selbst um, neu eingeben muss man nichts.
- Das Gerätemenü öffnet sich nicht mehr ein zweites Mal über dem ersten. Das Tastenkürzel holt stattdessen das offene Menü nach vorn; das stehengebliebene wurde vorher stillschweigend nicht mehr aktualisiert."""
