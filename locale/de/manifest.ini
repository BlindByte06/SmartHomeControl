summary = "Smart Home Control"
description = "Smart-Home-Geräte (Meross, Netatmo, VeSync/Levoit, Cozytouch/Atlantic - Cozytouch experimentell) direkt aus NVDA über ein barrierefreies Menü steuern"
changelog = "Beta. Geänderte Zugangsdaten werden jetzt vor dem Speichern bei der Plattform angemeldet und erreichen auch eine bereits laufende Sitzung - ein falsches Passwort wurde bisher stillschweigend übernommen und fiel erst beim nächsten NVDA-Start auf. Nach einer abgelehnten Anmeldung lassen sich die Zugangsdaten sofort erneut eingeben, beim betroffenen Tab. Zwei gleichzeitige Anmeldungen derselben Plattform kommen nicht mehr vor."
