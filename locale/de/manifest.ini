summary = "Smart Home Control"
description = """Smart-Home-Geräte (Meross, Netatmo, VeSync, Cozytouch/Atlantic, Petlibro - Cozytouch und Petlibro experimentell) direkt aus NVDA steuern"""
changelog = """- Netatmo: "Zu Favoriten hinzufügen" steht im Geräte-Menü wieder zur Verfügung.
- VeSync und Cozytouch: Eine hier geänderte Einstellung wird nicht mehr zusätzlich als Änderung von außen verbucht.
- Cozytouch: Ein Befehl, den das Gerät erst verzögert übernimmt, wird als gesendet angesagt und bestätigt, sobald er ankommt, statt als Fehler gemeldet zu werden.
- Cozytouch: Ein Boost, der nach einem NVDA-Neustart abläuft, wird als beendet verbucht, und Verlaufseinträge bleiben erhalten, wenn das Menü vorher geschlossen wird.
- Der Abwesenheitszeitraum von Cozytouch erscheint im Datumsformat der Region.
- Meross: Ein hier geschaltetes Gerät gilt nicht mehr als von außen geschaltet.
- Netatmo-Anmeldung: Ein fremder Aufruf der Rückrufadresse bricht die Anmeldung nicht mehr ab."""
