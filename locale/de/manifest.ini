summary = "Smart Home Control"
description = """Smart-Home-Geräte (Meross, Netatmo, VeSync, Cozytouch/Atlantic, Petlibro - Cozytouch und Petlibro experimentell) direkt aus NVDA steuern"""
changelog = """- NVDA stürzt nicht mehr ab, wenn das Geräte-Menü geschlossen wird, nachdem ein Gerät im Favoriten-Tab geschaltet wurde.
- Enter oder Leertaste auf einem VeSync- oder Cozytouch-Gerät lässt NVDA nicht mehr einfrieren.
- Ein Wassermelder, der beim Start von NVDA schon Wasser meldet, wird jetzt angesagt.
- Bei einem Meross-Konto mit Zwei-Faktor-Anmeldung wird das als Grund genannt, und die Anmeldung wird nicht mehr endlos wiederholt.
- Das Testen der Netatmo-Verbindung macht die laufende Anmeldung nicht mehr ungültig.
- Eine Serverstörung bei der Cozytouch-Anmeldung wird wiederholt.
- Erneuerte Tokens schreiben nicht mehr die gesamte NVDA-Konfiguration auf die Festplatte.
- NVDA beendet sich bei langsamem Netz schneller.
- Meross-Garagentoröffner und -Rollläden werden angezeigt, aber nicht geschaltet."""
